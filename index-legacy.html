<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7a0f0f">
<title>LEGACY — DISCONTINUED ):</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@700&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
:root{--red:#8a0f14;--paper:#e8dcc6;--ink:#111}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:'IBM Plex Mono',monospace;border:6px solid var(--red);padding:20px}
.card{max-width:640px;width:100%;background:#fff;border:3px solid #111;box-shadow:6px 6px 0 #111;padding:0;transform:rotate(-0.4deg)}
.head{background:var(--red);color:#f5e6a3;padding:10px 14px;border-bottom:3px solid #111;font:700 10px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between}
.body{padding:28px 22px}
.stamp{display:inline-block;background:var(--red);color:#fff;border:2px solid #111;padding:4px 8px;font:900 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;transform:rotate(-1deg);margin-bottom:14px}
h1{font:900 32px 'Playfair Display',serif;line-height:.9;text-transform:uppercase;margin-bottom:12px}
h1 i{font-style:normal;background:var(--red);color:#fff;padding:0 6px}
p{font:600 13px 'IBM Plex Mono',monospace;line-height:1.6;color:#222;margin-bottom:14px}
a{display:inline-block;background:#111;color:#f5e6a3;border:2px solid #111;padding:8px 14px;font:700 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;box-shadow:3px 3px 0 #111}
a:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #111}
.foot{margin-top:14px;padding-top:10px;border-top:2px dashed #111;font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#5a5242}
</style>
</head>
<body>
<div class="card">
  <div class="head"><span>ГОСПЛАН // ARCHIVE</span><span>№ 000 — LEGACY</span></div>
  <div class="body">
    <div class="stamp">★ DISCONTINUED</div>
    <h1><i>Legacy</i> Version Discontinued</h1>
    <p>thank you for helping me experiment :)</p>
    <p style="color:#5a5242">The old Red Star market has been retired. The new Gosplan portal is the active record.</p>
    <a href="./">← BACK TO GOSPLAN CENTRAL</a>
    <div class="foot">USSR-STOCK // HyawiiGithub 2026 // stamp № 001</div>
  </div>
</div>
</body>
</html>
